name: Mavie
options:
  bundleIdPrefix: app.mavie
  deploymentTarget:
    iOS: "16.0"
    macOS: "13.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "2.2.0"
    CURRENT_PROJECT_VERSION: "220"

targets:
  MavieMacOS:
    type: application
    platform: macOS
    sources:
      - path: macOS
        excludes:
          - "**/*.sh"
          - "**/*.spec"
          - "**/*.plist"
          - "**/*.entitlements"
          - "**/scripts/**"
      - path: Shared
    entitlements:
      path: macOS/MavieMac.entitlements
    settings:
      base:
        PRODUCT_NAME: Mavie
        PRODUCT_MODULE_NAME: MavieMacOS
        PRODUCT_BUNDLE_IDENTIFIER: app.mavie.macos
        INFOPLIST_FILE: macOS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO

  MavieIOS:
    type: application
    platform: iOS
    sources:
      - path: iOS
        excludes:
          - "**/*.plist"
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: Mavie
        PRODUCT_MODULE_NAME: MavieIOS
        PRODUCT_BUNDLE_IDENTIFIER: app.mavie.ios
        INFOPLIST_FILE: iOS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_TESTING_SEARCH_PATHS: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""

  MavieIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: MavieIOS
    settings:
      base:
        PRODUCT_NAME: MavieIOSTests
        PRODUCT_BUNDLE_IDENTIFIER: app.mavie.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Mavie.app/Mavie"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""

schemes:
  MavieMacOS:
    build:
      targets:
        MavieMacOS: all
    run:
      config: Debug
    archive:
      config: Release

  MavieIOS:
    build:
      targets:
        MavieIOS: all
        MavieIOSTests: [test]
    test:
      config: Debug
      targets:
        - MavieIOSTests
    archive:
      config: Release
