name: Cineva Multi-Platform CI & Releases

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  backend-and-web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install optional media dependency
        run: pip install -r requirements.txt
      - name: Install native Ubuntu FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Run Python Backend, Cloud Admin & Security Tests
        env:
          FFMPEG_PATH: /usr/bin/ffmpeg
          IMAGEIO_FFMPEG_EXE: /usr/bin/ffmpeg
        run: python -m unittest discover -s tests -v
      - name: Run Web Frontend Unit Tests
        run: node --test tests/test_*.mjs

  android-build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Android Unit Tests & Build APK
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Cineva-Android
          path: android/app/build/outputs/apk/release/*.apk

  windows-desktop-package:
    runs-on: windows-latest
    needs: backend-and-web-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Standalone Portable Cineva.exe
        run: |
          pip install pyinstaller imageio-ffmpeg tzdata
          pyinstaller windows\cineva.spec
      - name: Smoke Test Built Cineva.exe
        shell: pwsh
        run: |
          $dataDir = Join-Path $env:RUNNER_TEMP "cineva-smoke"
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          $env:CINEVA_DATA_DIR = $dataDir
          $proc = Start-Process -FilePath "dist\Cineva.exe" -ArgumentList "--serve", "--host", "127.0.0.1", "--port", "18844" -PassThru
          try {
            $ok = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Milliseconds 500
              if ($proc.HasExited) { throw "Cineva.exe exited prematurely with code $($proc.ExitCode)" }
              try {
                $resp = Invoke-RestMethod -Uri "http://127.0.0.1:18844/api/health" -TimeoutSec 2
                if ($resp.app -eq "cineva" -and $resp.ok -eq $true) { $ok = $true; break }
              } catch {}
            }
            if (-not $ok) { throw "Cineva.exe health check did not pass in time" }
            $homeResp = Invoke-WebRequest -Uri "http://127.0.0.1:18844/" -UseBasicParsing -TimeoutSec 5
            if ($homeResp.StatusCode -ne 200) { throw "Unexpected status $($homeResp.StatusCode)" }
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }
      - name: Build Windows Setup Wizard (Cineva-Setup.exe)
        run: |
          choco install innosetup -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows\CinevaSetup.iss
      - uses: actions/upload-artifact@v4
        with:
          name: Cineva-Windows
          path: |
            dist/Cineva.exe
            dist/Cineva-Setup.exe

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [android-build-and-test, windows-desktop-package]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Rename Universal Android APK
        run: |
          APK_FILE=$(find release-assets -name 'app-universal-release*.apk' | head -n 1)
          if [ -n "$APK_FILE" ]; then cp "$APK_FILE" release-assets/Cineva-Android.apk; fi
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/Cineva-Windows/Cineva-Setup.exe
            release-assets/Cineva-Windows/Cineva.exe
            release-assets/Cineva-Android.apk
