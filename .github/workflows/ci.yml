name: Mavie Multi-Platform CI & Releases

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish GitHub Release assets for all 4 platforms'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Release tag to use when manually publishing from a branch (e.g. v2.2.0)'
        required: false
        type: string
        default: 'v2.2.0'

permissions:
  contents: write

jobs:
  backend-and-web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install optional media dependency
        run: pip install -r requirements.txt
      - name: Install native Ubuntu FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Run Python Unit & Integration Tests
        env:
          FFMPEG_PATH: /usr/bin/ffmpeg
          IMAGEIO_FFMPEG_EXE: /usr/bin/ffmpeg
        run: python -m unittest tests/test_*.py -v
      - name: Run Python E2E Suite (Tiers 1-4)
        env:
          FFMPEG_PATH: /usr/bin/ffmpeg
          IMAGEIO_FFMPEG_EXE: /usr/bin/ffmpeg
        run: python -m tests.e2e.runner --tier all -v
      - name: Run Web Frontend & Website Unit Tests
        run: node --test tests/test_*.mjs

  android-build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Android Unit Tests & Build Release APK + AAB
        working-directory: android
        run: |
          ./gradlew :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:assembleRelease
          ./gradlew :app:bundleRelease
      - name: Verify Android Release Outputs
        run: |
          test -n "$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          test -n "$(find android/app/build/outputs/bundle/release -name '*.aab' | head -n 1)"
      - uses: actions/upload-artifact@v4
        with:
          name: Mavie-Android
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab

  windows-desktop-package:
    runs-on: windows-latest
    needs: backend-and-web-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Standalone Portable Mavie.exe
        run: |
          pip install pyinstaller imageio-ffmpeg tzdata
          pyinstaller windows\mavie.spec
      - name: Smoke Test Built Mavie.exe (--serve and normal launcher)
        shell: pwsh
        run: |
          # 1. Verify headless --serve mode
          $serveData = Join-Path $env:RUNNER_TEMP "mavie-smoke-serve"
          New-Item -ItemType Directory -Force -Path $serveData | Out-Null
          $env:MAVIE_DATA_DIR = $serveData
          $serveProc = Start-Process -FilePath "dist\Mavie.exe" -ArgumentList "--serve", "--host", "127.0.0.1", "--port", "18844" -PassThru
          try {
            $ok = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Milliseconds 500
              if ($serveProc.HasExited) { throw "Mavie.exe --serve exited prematurely with code $($serveProc.ExitCode)" }
              try {
                $resp = Invoke-RestMethod -Uri "http://127.0.0.1:18844/api/health" -TimeoutSec 2
                if ($resp.app -eq "mavie" -and $resp.ok -eq $true) { $ok = $true; break }
              } catch {}
            }
            if (-not $ok) { throw "Mavie.exe --serve health check did not pass in time" }
            $homeResp = Invoke-WebRequest -Uri "http://127.0.0.1:18844/" -UseBasicParsing -TimeoutSec 5
            if ($homeResp.StatusCode -ne 200) { throw "Unexpected status $($homeResp.StatusCode)" }
          } finally {
            if (-not $serveProc.HasExited) {
              & taskkill /PID $serveProc.Id /T /F 2>$null | Out-Null
            }
          }

          # 2. Verify normal desktop launcher mode (>3s uptime, /api/health, clean desktop.log)
          $launcherData = Join-Path $env:RUNNER_TEMP "mavie-smoke-launcher"
          New-Item -ItemType Directory -Force -Path $launcherData | Out-Null
          $env:MAVIE_DATA_DIR = $launcherData
          $env:MAVIE_PORT = "18845"
          $launchProc = Start-Process -FilePath "dist\Mavie.exe" -PassThru
          try {
            $ok = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Milliseconds 500
              if ($launchProc.HasExited) { throw "Mavie.exe launcher exited prematurely with code $($launchProc.ExitCode)" }
              try {
                $resp = Invoke-RestMethod -Uri "http://127.0.0.1:18845/api/health" -TimeoutSec 2
                if ($resp.app -eq "mavie" -and $resp.ok -eq $true) { $ok = $true; break }
              } catch {}
            }
            if (-not $ok) { throw "Mavie.exe launcher health check did not pass in time" }
            Start-Sleep -Seconds 4
            if ($launchProc.HasExited) { throw "Mavie.exe launcher exited before 3s stability check (code $($launchProc.ExitCode))" }
            $resp2 = Invoke-RestMethod -Uri "http://127.0.0.1:18845/api/health" -TimeoutSec 2
            if ($resp2.app -ne "mavie" -or $resp2.ok -ne $true) {
              throw "Mavie.exe launcher health check failed after 4s"
            }
            $logFile = Join-Path $launcherData "desktop.log"
            if (-not (Test-Path $logFile)) { throw "Expected desktop.log at $logFile" }
            $logText = Get-Content -Path $logFile -Raw
            if ($logText -match "Traceback") {
              throw "Traceback detected in desktop.log:`n$logText"
            }
          } finally {
            Remove-Item Env:\MAVIE_PORT -ErrorAction SilentlyContinue
            if (-not $launchProc.HasExited) {
              & taskkill /PID $launchProc.Id /T /F 2>$null | Out-Null
            }
          }
      - name: Build Windows Setup Wizard (Mavie-Setup.exe)
        run: |
          choco install innosetup -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows\MavieSetup.iss
          if (-not (Test-Path "dist\Mavie-Setup.exe")) { throw "dist\Mavie-Setup.exe was not produced" }
      - uses: actions/upload-artifact@v4
        with:
          name: Mavie-Windows
          path: |
            dist/Mavie.exe
            dist/Mavie-Setup.exe

  apple-macos-and-ios:
    runs-on: macos-latest
    needs: backend-and-web-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python Packaging Dependencies & XcodeGen
        run: |
          python3 -m pip install --upgrade pip
          pip install pyinstaller imageio-ffmpeg tzdata
          brew install xcodegen
      - name: Generate Xcode Project (apple/Mavie.xcodeproj)
        run: |
          xcodegen generate --spec apple/project.yml --project apple
          test -d apple/Mavie.xcodeproj
      - name: Build & Smoke-Test macOS Mavie.app + DMG + ZIP
        run: |
          bash apple/macOS/build_macos.sh
          test -s dist/Mavie-macOS.dmg
          test -s dist/Mavie-macOS.zip
      - name: Run iOS XCTest Suite on iOS Simulator
        run: |
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          devices = data.get("devices", {})
          booted = []
          iphones = []
          for rt, devs in devices.items():
              if "iOS" not in rt:
                  continue
              for d in devs:
                  if not d.get("isAvailable"):
                      continue
                  if d.get("state") == "Booted":
                      booted.append(d["udid"])
                  if "iPhone" in d.get("name", ""):
                      iphones.append((rt, d["name"], d["udid"]))
          if booted:
              print(booted[0])
          elif iphones:
              iphones.sort(reverse=True)
              print(iphones[0][2])
          ')
          echo "Selected iOS Simulator ID: $SIM_ID"
          test -n "$SIM_ID"
          xcrun simctl boot "$SIM_ID" || true
          xcodebuild test \
            -project apple/Mavie.xcodeproj \
            -scheme MavieIOS \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -derivedDataPath build/ios-test-derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
      - name: Build Unsigned iOS App & Package Mavie-iOS.ipa
        run: |
          xcodebuild \
            -project apple/Mavie.xcodeproj \
            -scheme MavieIOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios-derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
          IOS_APP=$(find build/ios-derived/Build/Products -maxdepth 3 -type d -name "Mavie.app" | head -n 1)
          echo "Built iOS app bundle: $IOS_APP"
          test -d "$IOS_APP"
          test -f "$IOS_APP/Mavie"
          mkdir -p build/ipa/Payload dist
          cp -R "$IOS_APP" build/ipa/Payload/Mavie.app
          (cd build/ipa && zip -qry ../../dist/Mavie-iOS.ipa Payload)
          test -s dist/Mavie-iOS.ipa
          unzip -l dist/Mavie-iOS.ipa | grep -q "Payload/Mavie.app/Mavie"
      - uses: actions/upload-artifact@v4
        with:
          name: Mavie-macOS
          path: |
            dist/Mavie-macOS.dmg
            dist/Mavie-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Mavie-iOS
          path: dist/Mavie-iOS.ipa

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
    runs-on: ubuntu-latest
    needs: [android-build-and-test, windows-desktop-package, apple-macos-and-ios]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Normalize & Verify All 4-Platform Release Assets
        run: |
          APK_FILE=$(find release-assets -name 'app-universal-release*.apk' | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find release-assets -name '*.apk' | head -n 1)
          fi
          test -n "$APK_FILE"
          cp "$APK_FILE" release-assets/Mavie-Android.apk

          AAB_FILE=$(find release-assets -name '*.aab' | head -n 1)
          test -n "$AAB_FILE"
          cp "$AAB_FILE" release-assets/Mavie-Android.aab

          for asset in \
            release-assets/Mavie-Windows/Mavie-Setup.exe \
            release-assets/Mavie-Windows/Mavie.exe \
            release-assets/Mavie-Android.apk \
            release-assets/Mavie-Android.aab \
            release-assets/Mavie-macOS/Mavie-macOS.dmg \
            release-assets/Mavie-macOS/Mavie-macOS.zip \
            release-assets/Mavie-iOS/Mavie-iOS.ipa; do
            test -s "$asset" || { echo "Missing or empty release asset: $asset" >&2; exit 1; }
          done
          ls -lh release-assets/Mavie-Windows/ release-assets/Mavie-macOS/ release-assets/Mavie-iOS/ release-assets/Mavie-Android.*
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag || 'v2.2.0' }}
          name: Mavie ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag || 'v2.2.0' }}
          generate_release_notes: true
          files: |
            release-assets/Mavie-Windows/Mavie-Setup.exe
            release-assets/Mavie-Windows/Mavie.exe
            release-assets/Mavie-Android.apk
            release-assets/Mavie-Android.aab
            release-assets/Mavie-macOS/Mavie-macOS.dmg
            release-assets/Mavie-macOS/Mavie-macOS.zip
            release-assets/Mavie-iOS/Mavie-iOS.ipa
