name: Cineva Multi-Platform CI & Releases

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  backend-and-web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install optional media dependency
        run: pip install -r requirements.txt
      - name: Run Python Backend, Cloud Admin & Security Tests
        run: python -m unittest discover -s tests
      - name: Run Web Frontend Unit Tests
        run: node --test tests/test_*.mjs

  android-build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Android Unit Tests & Build APK
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Cineva-Android
          path: android/app/build/outputs/apk/release/*.apk

  windows-desktop-package:
    runs-on: windows-latest
    needs: backend-and-web-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Standalone Portable Cineva.exe
        run: |
          pip install pyinstaller imageio-ffmpeg
          pyinstaller windows\cineva.spec
      - name: Build Windows Setup Wizard (Cineva-Setup.exe)
        run: |
          choco install innosetup -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows\CinevaSetup.iss
      - uses: actions/upload-artifact@v4
        with:
          name: Cineva-Windows
          path: |
            dist/Cineva.exe
            dist/Cineva-Setup.exe

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [android-build-and-test, windows-desktop-package]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Rename Universal Android APK
        run: |
          cp release-assets/Cineva-Android/app-universal-release*.apk release-assets/Cineva-Android.apk || true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/Cineva-Windows/Cineva-Setup.exe
            release-assets/Cineva-Windows/Cineva.exe
            release-assets/Cineva-Android.apk
